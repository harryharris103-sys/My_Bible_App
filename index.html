// ---------- cloud folder (share links) ----------
const web=u=>/^https?:\/\//i.test(u||''),prov=u=>!web(u)?'':/dropbox\.com/i.test(u)?'Dropbox':/drive\.google\.com|docs\.google\.com/i.test(u)?'Google Drive':/1drv\.ms|onedrive\.|sharepoint\.com/i.test(u)?'OneDrive':/\/s\/[\w-]+\/?$/.test(u)?'Nextcloud':'Link',det=u=>prov(u)?'Detected: '+prov(u):'';
function direct(u){u=u.trim();const p=prov(u);
 if(p=='Dropbox'){const x=new URL(u);x.searchParams.set('dl','1');x.searchParams.delete('raw');return x.href}
 if(p=='Google Drive'){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u}
 if(p=='OneDrive')return 'https://api.onedrive.com/v1.0/shares/u!'+btoa(u).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_')+'/root/content';
 if(p=='Nextcloud')return u.replace(/\/+$/,'')+'/download';
 return u}
async function pull(){const u=(S.cloudFile||'').trim();if(!web(u)){toast('Paste a link to the saved file in More > Cloud folder');return}
 toast('Fetching from '+prov(u)+'…');
 try{const r=await fetch(direct(u));if(!r.ok)throw Error(r.status);const j=JSON.parse(await r.text());if(j&&j.app=='scripture-reader')restore(j);else toast('That link is not a Scripture file')}
 catch(e){sh('Could not read the link',`<p class="mu">${esc(prov(u))} may block direct reads from web apps, or the link is private or points to a folder. Check that sharing is set to anyone with the link and that it is the file itself. Otherwise, open the link, download the file and use Import from device.</p><div class="row"><button class="btn" data-op="${esc(u)}">Open link</button></div>`)}}
function sendSheet(){const nm=Object.keys(marks).length;if(!dock.length&&!nm){toast('Your dock is empty');return}const p=prov(S.cloudDir);
 sh('Send to cloud',`<p class="mu">${dock.length} saved passage${dock.length==1?'':'s'} and ${nm} highlight${nm==1?'':'s'} go into <b>scripture-dock.json</b>.</p><div class="row"><button class="btn pri" data-up="share">Share to Drive, Dropbox, OneDrive…</button><button class="btn" data-up="save">Download file</button>${p?`<button class="btn" data-up="open">Open ${esc(p)} folder</button>`:''}</div><p class="mu">${p?'Put the file in your linked folder. Replacing a file with the same name keeps its link working.':'Add a folder link in More > Cloud folder to open your folder from here.'}</p>`)}
async function upload(a){const f=new File([bak(1)],'scripture-dock.json',{type:'application/json'});
 if(a=='open'){if(web(S.cloudDir))open(S.cloudDir,'_blank');return}
 if(a=='share'){if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]})}catch(x){}}else toast('File sharing is not supported here. Use Download');return}
 const l=document.createElement('a');l.href=URL.createObjectURL(f);l.download=f.name;l.click();toast('Downloaded scripture-dock.json')}
// ---------- more ----------
function drawMore(){const p=$('#p-more');p.innerHTML=`<h2>Appearance</h2><div class="seg" id="tseg">${['auto','light','dark'].map(t=>`<button data-th="${t}" class="${S.theme==t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
<label class="mu" style="display:block;margin-top:12px">Text size</label><input type="range" id="sz" min="14" max="30" value="${S.size}">
<h2>Bible versions</h2>${vers.map(v=>`<div class="card"><div class="bd"><div class="t">${esc(v.id)}</div><div class="mu">${esc(v.label)}${v.n?' \u00b7 '+v.n.toLocaleString()+' verses':''}</div></div><button class="ib" data-del="${v.id}" aria-label="Remove ${esc(v.id)}">${ic('trash')}</button></div>`).join('')||'<p class="mu">None yet.</p>'}
<div class="row"><button class="btn" id="bimp">Import from device</button><button class="btn pri" id="bsync">Sync now</button></div><p class="mu">Import accepts .json files and EasyWorship .ewb Bibles. You can pick several at once.</p>
<label class="mu" style="display:block">GitHub folder (optional if this page runs on github.io)</label><input type="text" id="repo" placeholder="owner/repo or owner/repo/folder" value="${esc(S.repo)}">
<label class="tg"><span>Sync when the app opens</span><input type="checkbox" id="auto" ${S.auto?'checked':''}></label>
<h2>Sharing</h2><label class="tg"><span>Include verse numbers in shared text</span><input type="checkbox" id="nums" ${S.nums?'checked':''}></label>
<h2>Cloud folder</h2><p class="mu">Link a shared Dropbox, Google Drive or OneDrive folder to send docked verses to, and a link to the saved file to import from. Local backup below still works.</p>
<label class="mu" style="display:block">Folder link (where to send)</label><input type="text" id="cdir" placeholder="Shared folder link" value="${esc(S.cloudDir)}"><div class="mu" id="cdirp">${det(S.cloudDir)}</div>
<label class="mu" style="display:block;margin-top:8px">File link (where to import from)</label><input type="text" id="cfile" placeholder="Link to scripture-dock.json" value="${esc(S.cloudFile)}"><div class="mu" id="cfilep">${det(S.cloudFile)}</div>
<div class="row"><button class="btn pri" id="cup">Send docked verses</button><button class="btn" id="cdn">Import from link</button></div>
<h2>Daily verses</h2><label class="tg"><span>Send a random verse each day</span><input type="checkbox" id="nOn" ${N.on?'checked':''}></label>
${N.slots.map((x,i)=>`<label class="tg"><span><input type="checkbox" data-ns="${i}" ${x.on?'checked':''}> ${x.k[0].toUpperCase()+x.k.slice(1)}</span><input type="time" data-nt="${i}" value="${x.t}"></label>`).join('')}
<div class="row"><button class="btn" id="ntest">Send a test verse</button></div><p class="mu">Verses come from ${esc(S.ver||'your current version')}. They arrive on time while the app is open or recently used; when it is closed, your phone decides when to wake it.</p>
<h2>Backup</h2><p class="mu">Saves your dock, notes, highlights and settings to a file. Import it on this or another device to bring them back.</p><div class="row"><button class="btn" id="bsave">Save backup file</button><button class="btn" id="bshare">Share backup</button><button class="btn" id="brest">Import backup</button></div>
<h2>About</h2><p class="mu">Scripture v${VER}</p>`}
$('#p-more').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.th){S.theme=b.dataset.th;save();applyTheme();drawMore()}else if(b.dataset.del){if(confirm('Remove '+b.dataset.del+' from this device?')){await st('meta','readwrite',s=>s.delete(b.dataset.del));await st('bible','readwrite',s=>s.delete(b.dataset.del));cache.delete(b.dataset.del);await loadVers();await render();drawMore()}}
 else if(b.id=='cup')sendSheet();else if(b.id=='cdn')pull();else if(b.id=='bimp'||b.id=='brest')$('#imp').click();else if(b.id=='bsync'){S.repo=$('#repo').value;save();sync()}
 else if(b.id=='bsave'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bak()],{type:'application/json'}));a.download=bname();a.click();toast('Backup saved')}
 else if(b.id=='bshare'){const f=new File([bak()],bname(),{type:'application/json'});if(navigator.canShare?.({files:[f]}))try{await navigator.share({files:[f]})}catch(x){}else toast('Sharing files is not supported here — use Save')}});
$('#p-more').addEventListener('input',e=>{const t=e.target;if(t.id=='sz'){S.size=+t.value;applySize();save()}else if(t.id=='repo'){S.repo=t.value;save()}else if(t.id=='auto'){S.auto=t.checked;save()}else if(t.id=='nums'){S.nums=t.checked;save()}else if(t.id=='cdir'||t.id=='cfile'){S[t.id=='cdir'?'cloudDir':'cloudFile']=t.value.trim();save();$('#'+t.id+'p').textContent=det(t.value)}});
// ---------- theme, views ----------
const dm=matchMedia('(prefers-color-scheme:dark)'),dark=()=>S.theme=='dark'||(S.theme=='auto'&&dm.matches);
function applyTheme(){document.documentElement.dataset.theme=dark()?'dark':'light';$('#th').innerHTML=ic(dark()?'sun':'moon');document.querySelector('meta[name=theme-color]').content=dark()?'#0f1220':'#f2f3ef'}
const applySize=()=>document.documentElement.style.setProperty('--fs',S.size+'px');
$('#th').onclick=()=>{S.theme=dark()?'light':'dark';save();applyTheme();if(view=='more')drawMore()};dm.onchange=applyTheme;
const wide=()=>matchMedia('(min-width:900px) and (min-height:521px)').matches;
function setView(v){view=v;const a=$('#app');a.dataset.view=v;if(v!='read')$('#side').dataset.pane=v;paint();if(v=='dock')drawDock();if(v=='more')drawMore();if(v=='search')setTimeout(()=>$('#q').focus(),50)}
function paint(){const act=wide()?$('#side').dataset.pane:view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==act))}
$('nav').innerHTML=[['read','book','Read'],['search','search','Search'],['dock','rib','Dock'],['more','menu','More']].map(([t,i,l])=>`<button data-t="${t}">${ic(i)}<span>${l}</span></button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.t)};addEventListener('resize',paint);
$('#sync').innerHTML=ic('sync');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// ---------- daily verses (the service worker picks and shows them) ----------
let N={on:false,slots:[{k:'morning',t:'07:00',on:1},{k:'afternoon',t:'13:00',on:1},{k:'night',t:'20:00',on:1}],...ls('sr.n',{})};
const ping=async(m='check')=>{try{const r=await navigator.serviceWorker.ready;r.active&&r.active.postMessage({cmd:m})}catch(e){}};
async function saveNotify(){localStorage.setItem('sr.n',JSON.stringify(N));const o=(await st('meta','readonly',x=>x.get('__notify')))||{};await st('meta','readwrite',x=>x.put({id:'__notify',on:N.on,slots:N.slots,ver:S.ver,last:o.last||{},seen:o.seen||[]}));ping()}
$('#p-more').addEventListener('change',async e=>{const t=e.target;
 if(t.id=='nOn'){if(t.checked){const p=window.Notification?await Notification.requestPermission():'denied';if(p!='granted'){t.checked=false;toast('Allow notifications for this site in your browser settings first');return}
  try{const r=await navigator.serviceWorker.ready;await r.periodicSync?.register('daily-verse',{minInterval:36e5})}catch(x){}}
  N.on=t.checked;await saveNotify();toast(N.on?'Daily verses on':'Daily verses off')}
 else if(t.dataset.ns!==undefined){N.slots[+t.dataset.ns].on=t.checked?1:0;saveNotify()}
 else if(t.dataset.nt!==undefined){N.slots[+t.dataset.nt].t=t.value||'07:00';saveNotify()}});
$('#p-more').addEventListener('click',async e=>{if(e.target.id!='ntest')return;if(!window.Notification){toast('Notifications are not supported here');return}
 if(Notification.permission!='granted'&&await Notification.requestPermission()!='granted'){toast('Allow notifications first');return}
 if(!S.ver){toast('Add a Bible version first');return}await saveNotify();ping('test');toast('Test verse on its way')});
setInterval(()=>{if(N.on&&!document.hidden)ping()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&N.on)ping()});
navigator.serviceWorker?.addEventListener('message',e=>{const g=e.data&&e.data.go;if(g)go(g.b,g.c,g.v,g.ver)});
// ---------- start ----------
(async()=>{applyTheme();applySize();await loadVers();drawDock();drawMore();paint();await render();
 const gq=new URLSearchParams(location.search).get('go');if(gq){try{const g=JSON.parse(gq);go(g.b,g.c,g.v,g.ver)}catch(e){}history.replaceState(null,'',location.pathname)}if(N.on)saveNotify();
 if(vers.length?S.auto:true)sync(!!vers.length).then(()=>{if(!S.ver&&vers.length){S.ver=vers[0].id;render()}})})();
</script></body></html>
